services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mathloop
      POSTGRES_USER: mathloop
      POSTGRES_PASSWORD: mathloop
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathloop -d mathloop"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - mathloop-postgres:/var/lib/postgresql/data

volumes:
  mathloop-postgres:
